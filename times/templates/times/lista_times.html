<!DOCTYPE html>
<html>
<head>
    <title>Times de Futebol</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background-color: #020617;
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
        }

        ul {
            list-style: none;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        li {
            background: #1e293b;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        li:hover {
            transform: scale(1.03);
            background: #334155;
        }

        strong {
            font-size: 20px;
            color: #38bdf8;
        }

        .info {
            margin-top: 5px;
            font-size: 14px;
            color: #cbd5f5;
        }

    </style>

</head>
<body>

    <h1> Lista de Times</h1>

    <ul>
        {% for time in times %}
            <li>
                <strong>{{ time.nome }}</strong>
                <div class="info">
                    {{ time.cidade }} • Fundação: {{ time.fundacao }}
                </div>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
